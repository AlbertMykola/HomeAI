name = "homeai-openai-images"
main = "worker.js"
compatibility_date = "2026-09-17"

# Required:
#   npx wrangler secret put OPENAI_API_KEY
#
# Optional:
#   npx wrangler secret put MOBILE_GATE_KEY
#   npx wrangler secret put OPENAI_IMAGE_MODEL
#   npx wrangler secret put OPENAI_IMAGE_QUALITY

# Durable Object experiment (2026-10-20, US relay for OpenAI) did not help and was removed.
# Cloudflare keeps migration history, so both steps stay here.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["OpenAIRelay"]

[[migrations]]
tag = "v2"
deleted_classes = ["OpenAIRelay"]
