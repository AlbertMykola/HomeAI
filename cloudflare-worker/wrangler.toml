name = "gemini-secure-proxy"
main = "worker.js"
compatibility_date = "2025-10-29"
preview_urls = false

# Deployed as `gemini-secure-proxy` (the URL the app calls): npx wrangler deploy
#
# Secrets (never in git):
#   NEW_GEMINI_KEY_3                   AI Studio key in use (GEMINI_API_KEY is read only when it is unset)
#   DEV_BYPASS_TOKEN                   Debug simulator builds only (same value as ~/.rehomely-dev-token)
#   GCP_SERVICE_ACCOUNT_JSON           Vertex instead of AI Studio (optional; GEMINI_UPSTREAM = vertex | ai_studio)
#   MOBILE_GATE_KEY                    optional header gate (the app does not send it on Gemini calls: keep unset)

[vars]
# "soft": app versions without App Attest (1.2.1 and older) keep working on the per-IP limit.
# "enforce": every call needs a valid App Attest assertion. Switch once those versions are gone.
GEMINI_ATTEST_MODE = "soft"
ATTEST_APP_ID = "5998UF2M9Y.com.albert.apps.design.ai"
LIMIT_IMAGE_DEVICE_PER_MINUTE = "4"
LIMIT_IMAGE_DEVICE_PER_DAY = "40"
# App: 8 per 4 h for subscribers; the worker allows 10 per 4-hour UTC slot (retries / edits).
IMAGE_WINDOW_HOURS = "4"
LIMIT_IMAGE_DEVICE_PER_WINDOW = "10"
LIMIT_IMAGE_IP_PER_MINUTE = "6"
LIMIT_IMAGE_IP_PER_DAY = "60"
LIMIT_TEXT_DEVICE_PER_MINUTE = "20"
LIMIT_TEXT_DEVICE_PER_DAY = "300"
LIMIT_TEXT_IP_PER_MINUTE = "30"
LIMIT_TEXT_IP_PER_DAY = "400"

# App Attest keys + counters live in the OpenAI worker's Durable Object (the app registers its key there).
[[durable_objects.bindings]]
name = "DEVICE_GUARD"
class_name = "DeviceGuard"
script_name = "fragrant-fog-a5e3"
